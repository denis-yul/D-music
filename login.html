<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Music</title>

    <link rel="stylesheet" href="src/css/login.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#222222">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music">
    <link rel="apple-touch-icon" href="src/img/icon-192.png">
</head>
<body>

    <main>

        <div class="login-box">

            <div class="logo">
                <img src="src/img/logo.svg" alt="Logo">
            </div>

            <form id="loginForm" novalidate>

                <label for="email">Correo Electrónico:</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Ejemplo@Gmail.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Contraseña:</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                    >◉</button>

                </div>

                <a href="#" class="forgot" id="forgotLink">
                    ¿Olvidaste tu contraseña?
                </a>

                <!-- MENSAJES -->
                <p id="loginMensaje" class="login-mensaje" role="alert" aria-live="polite"></p>
                <button
                    type="button"
                    id="resendVerificationBtn"
                    class="resend-verification"
                    hidden
                >Reenviar correo de verificación</button>

                <button type="submit" class="btn-login">
                    INICIAR SESIÓN
                </button>

                <div class="separator">
                    <span></span> o <span></span>
                </div>

                <button type="button" class="btn-register" id="registerBtn">
                    CREAR CUENTA
                </button>

            </form>

        </div>

    </main>

    <script type="module" src="src/js/login.js"></script>
    <script src="src/js/pwa.js"></script>

</body>
</html>
